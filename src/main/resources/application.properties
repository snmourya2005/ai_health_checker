spring.application.name=healthchecker
server.port=${PORT:8081}

# Database Connection (Supports Cloud Deployments like Render/Railway/Supabase + Local MySQL Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:mysql://localhost:3306/ai_health_checker}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DATABASE_USERNAME:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:sql80}}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Stripe Payment Key (Set your own test key or environment variable)
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_placeholder_key}

# AI Configuration (Optional: set an API key for OpenAI/Gemini/Groq, otherwise uses offline deterministic engine)
ai.api-key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.model=${AI_MODEL:gpt-4o-mini}
